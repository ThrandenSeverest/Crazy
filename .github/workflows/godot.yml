name: Godot project checks

on:
  push:
  pull_request:

jobs:
  godot-headless:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Import project
        run: godot --headless --path . --import --quit
      - name: Launch world map briefly
        run: godot --headless --path . --quit-after 30
